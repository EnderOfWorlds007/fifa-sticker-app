<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00c2a8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Refresh Sticker Scanner</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #080d0f; color: #f4f7f8; }
    main { width: min(34rem, calc(100% - 2rem)); padding: 1.5rem; border: 1px solid #344047; border-radius: 1rem; background: #12191d; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: #b9c2c7; line-height: 1.5; }
    button, a { display: inline-block; box-sizing: border-box; padding: .8rem 1rem; border: 0; border-radius: .7rem; font: inherit; font-weight: 700; text-decoration: none; }
    button { background: #00c2a8; color: #031310; }
    a { margin-left: .5rem; background: #293239; color: #f4f7f8; }
  </style>
</head>
<body>
  <main>
    <h1>Refreshing the scanner</h1>
    <p id="status" role="status" aria-live="polite">Removing old offline app files. Your collection and settings are not affected.</p>
    <button id="retry" type="button" hidden>Try refresh again</button>
    <a href="/fifa-sticker-app/v2/scanner/?v=build-9c4a1f2e7b63">Open scanner</a>
  </main>
  <script>
    (() => {
      const BUILD_ID = "build-9c4a1f2e7b63";
      const status = document.querySelector("#status");
      const retry = document.querySelector("#retry");
      const target = () => `/fifa-sticker-app/v2/scanner/?v=${BUILD_ID}&cache-reset=${Date.now()}`;

      async function resetAppCache() {
        retry.hidden = true;
        status.textContent = "Removing old offline app files. Your collection and settings are not affected.";
        try {
          const registrations = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistrations() : [];
          await Promise.all(registrations
            .filter((registration) => new URL(registration.scope).pathname.startsWith("/fifa-sticker-app/"))
            .map((registration) => registration.unregister()));
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(names
              .filter((name) => name.startsWith("fifa-card-apps"))
              .map((name) => caches.delete(name)));
          }
          status.textContent = "Old app cache removed. Opening the current scanner…";
          window.location.replace(target());
        } catch (error) {
          status.textContent = `Automatic refresh failed: ${error instanceof Error ? error.message : "unknown error"}`;
          retry.hidden = false;
        }
      }

      retry.addEventListener("click", resetAppCache);
      resetAppCache();
    })();
  </script>
</body>
</html>
