<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00c2a8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sticker Hub">
  <title>Trades</title>
  <link rel="manifest" href="/fifa-sticker-app/v2/manifest.webmanifest">
  <link rel="stylesheet" href="/fifa-sticker-app/v2/assets/styles.css?v=build-3a2d69ebaa05">
</head>
<body class="tradeLookupBody appShellBody">
  <main class="tradeLookupShell phoneAppShell">
    <header class="tradeLookupTop appPageHeader">
      <div>
        <p class="appsEyebrow">Trades</p>
        <h1>Trade desk</h1>
        <p>Review drafts, reservations, completed exchanges, and cancelled trade history saved on this phone.</p>
      </div>
      <a class="buttonLike secondary" href="/fifa-sticker-app/v2/trade/">New trade</a>
    </header>

    <section class="tradeLookupCard appSurface">
      <section class="tradeGroup" aria-labelledby="draftTradesHeading">
        <h2 id="draftTradesHeading">Drafts</h2>
        <ol id="draftTradesList" class="tradeLookupResults"></ol>
      </section>
      <section class="tradeGroup" aria-labelledby="reservedTradesHeading">
        <h2 id="reservedTradesHeading">Reserved</h2>
        <ol id="reservedTradesList" class="tradeLookupResults"></ol>
      </section>
      <section class="tradeGroup" aria-labelledby="completedTradesHeading">
        <h2 id="completedTradesHeading">Completed</h2>
        <ol id="completedTradesList" class="tradeLookupResults"></ol>
      </section>
      <section class="tradeGroup" aria-labelledby="cancelledTradesHeading">
        <h2 id="cancelledTradesHeading">Cancelled</h2>
        <ol id="cancelledTradesList" class="tradeLookupResults"></ol>
      </section>
      <p id="tradesStatus" class="collectionStatus" aria-live="polite"></p>
    </section>
  </main>

  <nav class="phoneTabBar" data-app-nav aria-label="Primary">
    <a href="/fifa-sticker-app/v2/getting-started/">Start</a>
    <a href="/fifa-sticker-app/v2/collection/">Collection</a>
    <a href="/fifa-sticker-app/v2/compare/">Compare</a>
    <a href="/fifa-sticker-app/v2/trades/" aria-current="page">Trades</a>
    <a href="/fifa-sticker-app/v2/scanner/" data-scan-link>Scan</a>
  </nav>
  <script src="/fifa-sticker-app/v2/assets/site_config.js"></script>
  <script src="/fifa-sticker-app/v2/assets/apps.js?v=build-3a2d69ebaa05" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/trades.js?v=build-3a2d69ebaa05" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/pwa.js?v=build-3a2d69ebaa05" type="module"></script>
</body>
</html>
