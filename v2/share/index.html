<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Trade stickers</title>
  <link rel="stylesheet" href="/fifa-sticker-app/v2/assets/styles.css?v=build-1fbffbba6425">
</head>
<body>
  <main class="collectionPage sharePage">
    <header class="collectionHero">
      <p class="eyebrow">Read-only trade list</p>
      <h1>Stickers to trade</h1>
      <p>This page shows what this collector needs and what they currently have available.</p>
    </header>

    <div id="shareStatus" class="localTrustStatus" data-severity="muted" aria-live="polite">
      <strong>Trade list</strong>
      <span>Loading the latest shared revision…</span>
    </div>
    <p id="shareUpdatedAt" class="hint" hidden></p>

    <label class="collectionSearch" for="shareSearch">
      <span>Search the shared lists</span>
      <input id="shareSearch" type="search" placeholder="Sticker code, team, or name" autocomplete="off">
    </label>

    <details id="shareNeedsPanel" class="collectionUpdateCard shareListDisclosure" open>
      <summary><span id="shareNeedsHeading" class="shareListHeading">They need <span id="shareNeedsCount"></span></span></summary>
      <div id="shareNeedsList" class="collectionTeamList"></div>
      <p id="shareNeedsEmpty" class="collectionEmpty" hidden>No matching needed stickers.</p>
    </details>

    <details id="shareOffersPanel" class="collectionUpdateCard shareListDisclosure" open>
      <summary><span id="shareOffersHeading" class="shareListHeading">They offer <span id="shareOffersCount"></span></span></summary>
      <div id="shareOffersList" class="collectionTeamList"></div>
      <p id="shareOffersEmpty" class="collectionEmpty" hidden>No matching stickers available to trade.</p>
    </details>
  </main>
  <script src="/fifa-sticker-app/v2/assets/site_config.js"></script>
  <script src="/fifa-sticker-app/v2/assets/share.js?v=build-1fbffbba6425" type="module"></script>
</body>
</html>
