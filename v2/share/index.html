<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Trade stickers</title>
  <link rel="stylesheet" href="/fifa-sticker-app/v2/assets/styles.css?v=build-2808667cc553">
</head>
<body>
  <main class="collectionPage sharePage">
    <header class="collectionHero shareHero">
      <p class="eyebrow">Find your next trade</p>
      <h1>Complete your collection</h1>
      <p>See what this collector is looking for—and the stickers they’re ready to trade.</p>
    </header>

    <div id="shareStatus" class="localTrustStatus" data-severity="muted" aria-live="polite">
      <strong>Live trade list</strong>
      <span>Loading the latest shared revision…</span>
    </div>
    <p id="shareUpdatedAt" class="hint" hidden></p>

    <label class="collectionSearch shareSearchPrompt" for="shareSearch">
      <span class="shareSearchKicker">Quick match finder</span>
      <span class="shareSearchTitle">Find your trade matches</span>
      <span id="shareSearchHelp" class="shareSearchHelp">Paste sticker codes, country lists, or a complete trade message. Formatting doesn’t matter: spaces, commas, and new lines all work.</span>
      <textarea id="shareSearch" rows="6" placeholder="Happy to trade:&#10;HAI 3&#10;France: 1, 17&#10;ENG13" autocomplete="off" aria-describedby="shareSearchHelp shareSearchExamples"></textarea>
      <span id="shareSearchExamples" class="shareSearchExamples"><span class="shareSearchExamplesLabel">Try</span><span>HAI 3</span><span>France: 1, 17</span><span>ENG13</span></span>
    </label>

    <div class="shareMatchActions" role="group" aria-label="Match this pasted list">
      <button id="shareMatchOfferButton" class="shareMatchDirection" type="button" aria-pressed="false" disabled>I offer</button>
      <button id="shareMatchNeedButton" class="shareMatchDirection" type="button" aria-pressed="false" disabled>I need</button>
      <button id="shareMatchClearButton" class="secondaryButton" type="button">Clear</button>
    </div>

    <section id="shareMatchResult" class="shareMatchResult" aria-live="polite" hidden>
      <label for="shareMatchText">Your match</label>
      <textarea id="shareMatchText" rows="4" readonly></textarea>
      <button id="shareCopyMatchButton" type="button" disabled>Copy match</button>
    </section>

    <details id="shareNeedsPanel" class="collectionUpdateCard shareListDisclosure">
      <summary>
        <span class="shareListSummaryContent">
          <span id="shareNeedsHeading" class="shareListHeading">They need <span id="shareNeedsCount"></span></span>
          <button id="shareNeedsToggleAll" class="shareToggleAll" type="button">Show all</button>
        </span>
      </summary>
      <div id="shareNeedsList" class="collectionTeamList"></div>
      <p id="shareNeedsEmpty" class="collectionEmpty" hidden>No matching needed stickers.</p>
    </details>

    <details id="shareOffersPanel" class="collectionUpdateCard shareListDisclosure">
      <summary>
        <span class="shareListSummaryContent">
          <span id="shareOffersHeading" class="shareListHeading">They offer <span id="shareOffersCount"></span></span>
          <button id="shareOffersToggleAll" class="shareToggleAll" type="button">Show all</button>
        </span>
      </summary>
      <div id="shareOffersList" class="collectionTeamList"></div>
      <p id="shareOffersEmpty" class="collectionEmpty" hidden>No matching stickers available to trade.</p>
    </details>
  </main>
  <script src="/fifa-sticker-app/v2/assets/site_config.js"></script>
  <script src="/fifa-sticker-app/v2/assets/share.js?v=build-2808667cc553" type="module"></script>
</body>
</html>
