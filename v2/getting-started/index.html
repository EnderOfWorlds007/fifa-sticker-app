<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00c2a8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sticker Hub">
  <title>Getting Started</title>
  <link rel="manifest" href="/fifa-sticker-app/v2/manifest.webmanifest">
  <link rel="stylesheet" href="/fifa-sticker-app/v2/assets/styles.css?v=build-373044315896">
</head>
<body class="tradeLookupBody gettingStartedBody">
  <main class="tradeLookupShell gettingStartedShell">
    <header class="tradeLookupTop">
      <div>
        <h1>Getting Started</h1>
        <p id="gettingStartedStatus">Paste, dictate, or scan two-page album photos to build the first album inventory draft.</p>
      </div>
      <nav class="appSwitcher" aria-label="Apps">
        <a href="/fifa-sticker-app/v2/apps/">Apps</a>
        <a href="/fifa-sticker-app/v2/collection/">Collection</a>
        <a href="/fifa-sticker-app/v2/compare/">Compare</a>
        <a href="/fifa-sticker-app/v2/trades/">Trades</a>
        <a href="/fifa-sticker-app/v2/scanner/" data-scan-link>Scan</a>
      </nav>
    </header>

    <section class="tradeLookupCard gettingStartedCard">
      <div data-trade-paste-box="getting-started"></div>
      <div class="tradeLookupActions albumPhotoActions">
        <button id="albumPhotoButton" type="button">Scan album pages</button>
        <button id="copyGettingStartedText" class="secondaryButton" type="button">Copy text</button>
        <input id="albumPhotoInput" type="file" accept="image/*" capture="environment" multiple hidden>
      </div>
      <details class="ocrBackendSettings">
        <summary>OCR backend</summary>
        <label>
          <span>Laptop URL</span>
          <input data-ocr-backend-url type="url" inputmode="url" autocomplete="off" placeholder="https://your-mac.tailnet.ts.net">
        </label>
        <label>
          <span>Token</span>
          <input data-ocr-backend-token type="password" autocomplete="off" placeholder="Optional backend token">
        </label>
        <div class="buttonRow">
          <button data-ocr-backend-save class="secondaryButton" type="button">Save backend</button>
          <button data-ocr-backend-test class="secondaryButton" type="button">Test backend</button>
        </div>
        <p data-ocr-backend-status class="hint">Blank laptop URL uses the deployed backend.</p>
      </details>
    </section>

    <section class="tradeLookupCard albumParseResults" aria-label="Album parse results">
      <h2>Album photo results</h2>
      <div id="albumParseList" class="albumParseList"></div>
    </section>
  </main>

  <nav class="phoneTabBar" data-app-nav aria-label="Primary">
    <a href="/fifa-sticker-app/v2/collection/">Collection</a>
    <a href="/fifa-sticker-app/v2/compare/">Compare</a>
    <a href="/fifa-sticker-app/v2/trades/">Trades</a>
    <a href="/fifa-sticker-app/v2/scanner/" data-scan-link>Scan</a>
  </nav>
  <script src="/fifa-sticker-app/v2/assets/site_config.js"></script>
  <script src="/fifa-sticker-app/v2/assets/apps.js" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/trade_paste_box.js?v=build-373044315896" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/getting_started.js?v=build-373044315896" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/pwa.js?v=build-373044315896" type="module"></script>
</body>
</html>
