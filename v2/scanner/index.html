<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00c2a8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sticker Hub">
  <title>Scan Stickers</title>
  <link rel="manifest" href="/fifa-sticker-app/v2/manifest.webmanifest">
  <link rel="stylesheet" href="/fifa-sticker-app/v2/assets/styles.css?v=build-960000000004">
</head>
<body class="appShellBody">
  <main class="shell">
    <header class="heroHeader compactHero">
      <p class="eyebrow">Scan</p>
      <h1>Scan stickers</h1>
      <p id="photoScannerStatus">Upload a clear sticker photo. Recognition runs on the configured laptop OCR backend.</p>
    </header>

    <section class="tradeLookupCard">
      <label for="photoScannerInput">Sticker photo</label>
      <input id="photoScannerInput" type="file" accept="image/*" capture="environment">
      <label for="photoScannerSide">Sticker side</label>
      <select id="photoScannerSide">
        <option value="back">Back</option>
        <option value="front">Front</option>
      </select>
      <details class="ocrBackendSettings">
        <summary>OCR backend</summary>
        <label>
          <span>Laptop Funnel URL</span>
          <input data-ocr-backend-url type="url" inputmode="url" autocomplete="off" placeholder="https://your-mac.tailnet.ts.net">
        </label>
        <label>
          <span>Laptop OCR token</span>
          <input data-ocr-backend-token type="password" autocomplete="off" placeholder="Token from setup script">
        </label>
        <div class="buttonRow">
          <button data-ocr-backend-save class="secondary" type="button">Save backend</button>
          <button data-ocr-backend-test class="secondary" type="button">Test backend</button>
        </div>
        <p data-ocr-backend-status class="hint">Blank laptop URL uses the deployed backend.</p>
      </details>
      <div class="buttonRow">
        <button id="photoScannerButton" type="button">Scan photo</button>
        <button id="photoScannerCopyButton" class="secondary" type="button" disabled>Copy codes</button>
      </div>
    </section>

    <section class="tradeLookupCard">
      <h2>Result</h2>
      <textarea id="photoScannerResult" rows="6" readonly placeholder="Recognized codes appear here."></textarea>
      <ol id="photoScannerCodes" class="tradeLookupResults"></ol>
    </section>
  </main>

  <nav class="phoneTabBar scannerTabBar" data-app-nav aria-label="Primary">
    <a href="/fifa-sticker-app/v2/collection/">Collection</a>
    <a href="/fifa-sticker-app/v2/compare/">Compare</a>
    <a href="/fifa-sticker-app/v2/trades/">Trades</a>
    <a href="/fifa-sticker-app/v2/scanner/" data-scan-link aria-current="page">Scan</a>
  </nav>
  <script src="/fifa-sticker-app/v2/assets/site_config.js"></script>
  <script src="/fifa-sticker-app/v2/assets/apps.js" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/photo_scanner.js?v=build-960000000004" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/pwa.js?v=build-960000000004" type="module"></script>
</body>
</html>
