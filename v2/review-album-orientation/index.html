<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00c2a8">
  <title>Review Album Orientation</title>
  <link rel="manifest" href="/fifa-sticker-app/v2/manifest.webmanifest">
  <link rel="stylesheet" href="/fifa-sticker-app/v2/assets/styles.css?v=build-orientation-review-1">
</head>
<body class="albumOrientationBody">
  <main class="albumOrientationShell">
    <header class="albumOrientationTop">
      <div>
        <h1>Orientation Review</h1>
        <p id="orientationStatus">Loading album pages...</p>
      </div>
      <nav class="appSwitcher" aria-label="Apps">
        <a href="/fifa-sticker-app/v2/apps/">Apps</a>
        <a href="/fifa-sticker-app/v2/review-album-pages/">Slot review</a>
      </nav>
    </header>

    <section class="albumOrientationControls" aria-label="Orientation review controls">
      <label>
        <span>Photo</span>
        <select id="orientationPhotoSelect"></select>
      </label>
      <div class="albumOrientationNav">
        <button id="orientationPrevious" type="button">Previous</button>
        <button id="orientationNext" type="button">Next</button>
      </div>
    </section>

    <section id="orientationDecision" class="orientationDecision">
      <div class="orientationDecisionText">
        <span id="orientationBadge" class="orientationBadge">-</span>
        <h2 id="orientationHeadline">Pick the orientation that makes the page readable.</h2>
        <p id="orientationReason">The suggested view is shown first. Alternatives are below.</p>
      </div>
      <div class="orientationActions">
        <button id="orientationOk" class="approve" type="button">OK</button>
        <button id="orientationWrong" class="bad" type="button">Wrong</button>
      </div>
    </section>

    <section id="orientationRecommended" class="orientationRecommended" aria-label="Recommended orientation"></section>
    <section id="orientationCandidates" class="orientationCandidates" aria-label="Orientation candidates"></section>

    <details id="orientationDiagnostics" class="orientationDiagnostics">
      <summary>Show collapsed processing text</summary>
      <div id="orientationDiagnosticSteps"></div>
    </details>
  </main>

  <script src="/fifa-sticker-app/v2/assets/site_config.js"></script>
  <script src="/fifa-sticker-app/v2/assets/apps.js" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/review_album_orientation.js?v=build-orientation-review-3" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/pwa.js?v=build-orientation-review-1" type="module"></script>
</body>
</html>
