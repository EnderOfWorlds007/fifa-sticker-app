<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00c2a8">
  <title>Photo Code Deep Dive</title>
  <link rel="manifest" href="/fifa-sticker-app/v2/manifest.webmanifest">
  <link rel="stylesheet" href="/fifa-sticker-app/v2/assets/styles.css?v=build-1fbffbba6425">
  <style>
    .debugTop {
      position: static;
      padding: 24px;
      border-bottom: 1px solid var(--border, #29313a);
    }
    .debugStageWrap {
      min-height: 70dvh;
      padding: 16px 24px 96px;
    }
    #photoCanvas {
      display: block;
      width: 100%;
      height: 70dvh;
      min-height: 520px;
      background: #090d10;
      border: 1px solid var(--border, #29313a);
      border-radius: 8px;
    }
    .overlayLegend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
      color: var(--muted, #9aa3ad);
    }
    .debugExplain {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    .anchorLogic ol {
      display: grid;
      gap: 8px;
      margin: 8px 0 0;
      padding-left: 24px;
    }
    .anchorCard {
      border: 1px solid var(--border, #29313a);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.04);
    }
    .anchorImage {
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border, #29313a);
    }
    .algorithmTrace {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .algorithmStep {
      border-left: 3px solid #00c2a8;
      padding: 8px 12px;
      background: rgba(0, 194, 168, 0.08);
    }
    .stepDecision {
      display: block;
      color: var(--muted, #9aa3ad);
      margin-top: 4px;
    }
  </style>
</head>
<body class="appBody">
  <main>
    <header class="debugTop">
      <p class="eyebrow">Scanner diagnostics</p>
      <h1>Photo Code Deep Dive</h1>
      <p>Inspect OCR crops, anchors, overlays, and recognition decisions from the same backend settings as Scanner.</p>
      <nav class="topNav" aria-label="Debug navigation">
        <a href="/fifa-sticker-app/v2/apps/">Apps</a>
        <a href="/fifa-sticker-app/v2/scanner/">Scanner</a>
      </nav>
    </header>

    <section class="debugStageWrap">
      <label class="fieldLabel" for="debugPhotoInput">Sticker back photo</label>
      <input id="debugPhotoInput" type="file" accept="image/*">
      <button id="debugAnalyzeButton" type="button">Analyze photo</button>
      <p id="debugStatus" class="hint">Choose a card-back photo to inspect.</p>

      <canvas id="photoCanvas"></canvas>
      <div id="overlayLegend" class="overlayLegend"></div>
      <section id="debugExplain" class="debugExplain"></section>
      <section id="algorithmTrace" class="algorithmTrace"></section>
    </section>
  </main>
  <script src="/fifa-sticker-app/v2/assets/site_config.js"></script>
  <script src="/fifa-sticker-app/v2/assets/photo_code_debug_review.js?v=build-1fbffbba6425" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/pwa.js?v=build-1fbffbba6425" type="module"></script>
</body>
</html>
