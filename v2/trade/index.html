<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00c2a8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sticker Hub">
  <title>Trade</title>
  <link rel="manifest" href="/fifa-sticker-app/v2/manifest.webmanifest">
  <link rel="stylesheet" href="/fifa-sticker-app/v2/assets/styles.css?v=build-373044315896">
</head>
<body class="tradeLookupBody appShellBody">
  <main class="tradeLookupShell phoneAppShell">
    <header class="tradeLookupTop appPageHeader">
      <div>
        <p class="appsEyebrow">Trade</p>
        <h1>Build trade</h1>
        <p id="tradeDraftStatus" class="hint">Loading trade details from this phone.</p>
      </div>
      <a class="buttonLike secondary" href="/fifa-sticker-app/v2/compare/">Back to Compare</a>
    </header>

    <section id="tradeDraftPanel" class="tradeLookupCard tradeDraftPanel">
      <div id="tradeBalanceSummary" class="tradeBalanceSummary" aria-live="polite">
        <div>
          <span>I give</span>
          <strong id="tradeGiveCount">0</strong>
        </div>
        <div>
          <span>I receive</span>
          <strong id="tradeReceiveCount">0</strong>
        </div>
        <div>
          <span>Balance</span>
          <strong id="tradeBalanceDelta">Even</strong>
        </div>
      </div>
      <div id="tradeReadiness" class="tradeReadiness" data-severity="ok" aria-live="polite">
        <strong id="tradeReadinessTitle">Ready to trade</strong>
        <span id="tradeReadinessDetail">Outgoing cards are available.</span>
      </div>
      <div class="compareGrid" aria-label="Trade basket">
        <div>
          <h3>I give</h3>
          <div class="tradeVariantToolbar" aria-label="Set outgoing variants">
            <button id="setAllGreenButton" class="secondaryButton" type="button">All green</button>
            <button id="setAllBlueButton" class="secondaryButton" type="button">All blue</button>
          </div>
          <ol id="tradeGiveList" class="tradeLookupResults tradeBasketResults"></ol>
        </div>
        <div>
          <h3>I receive</h3>
          <ol id="tradeReceiveList" class="tradeLookupResults tradeBasketResults"></ol>
        </div>
      </div>
      <div id="tradeOtherSidePanel" class="tradeOtherSidePanel" data-trade-paste-box="trade-builder"></div>
      <div id="tradeIssueList" class="tradeIssueList" role="status" aria-live="polite"></div>
      <div class="tradeLookupActions">
        <button id="saveTradeDraftButton" type="button">Save draft</button>
        <button id="reserveTradeButton" class="secondaryButton" type="button" disabled>Reserve</button>
        <button id="completeTradeButton" class="secondaryButton" type="button" disabled>Complete</button>
        <button id="cancelTradeButton" class="secondaryButton" type="button" disabled>Cancel</button>
      </div>
    </section>
  </main>

  <nav class="phoneTabBar" data-app-nav aria-label="Primary">
    <a href="/fifa-sticker-app/v2/collection/">Collection</a>
    <a href="/fifa-sticker-app/v2/compare/">Compare</a>
    <a href="/fifa-sticker-app/v2/trades/" aria-current="page">Trades</a>
    <a href="/fifa-sticker-app/v2/scanner/" data-scan-link>Scan</a>
  </nav>
  <script src="/fifa-sticker-app/v2/assets/site_config.js"></script>
  <script src="/fifa-sticker-app/v2/assets/apps.js" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/trade_paste_box.js?v=build-373044315896" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/trade_builder.js?v=build-373044315896" type="module"></script>
  <script src="/fifa-sticker-app/v2/assets/pwa.js?v=build-373044315896" type="module"></script>
</body>
</html>
